name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -r fts/requirements.txt
      - name: Lint
        run: ruff fts/src fts/tests
      - name: Test
        run: pytest fts/tests -q
