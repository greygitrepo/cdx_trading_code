exchange:
  name: bybit
  network: testnet
  category: linear
  symbols: [BTCUSDT, ETHUSDT, SOLUSDT, DOGEUSDT]  # BTC 단일 → 유동성 상위 확장
  prefer_maker_bps_threshold: 0.04
  maker_post_only: true
  taker_on_strong_score: true
  fallback_ioc: true

risk:
  # 레버리지 상한(러너는 기본 레버리지로 사용)
  max_leverage: 7                  # 기본 7배
  # 1회 주문에 사용할 유효 노셔널 상한(Equity 대비 비율)
  max_alloc_pct: 0.02              # 2%
  risk_per_trade_min: 0.002        # 0.2%
  risk_per_trade_max: 0.005        # 0.5%
  daily_max_loss: 0.015            # 2% → 1.5% 데일리 컷
  per_symbol_concentration: 0.30   # 40% → 30%
  # 자유 잔고 하한(이 값 미만이면 신규 진입 차단)
  min_free_balance_usdt: 100

params:
  universe:
    topN: 12
    spread_max_mult: 1.4           # 1.5 → 1.4 (스프레드 관리 강화)
    spread_threshold_pct: 0.0004    # 레짐 스프레드 임계(미드 대비 비율)
    depth_drop_pause: 0.70
    vwap_dev_for_vrs: 0.0035
  regime:
    crash_z: 4.0
    spread_mult_pause: 3.0
    pause_minutes: 3
    resume_rv_z: 1.5
    resume_spread_mult: 1.3
    resume_depth_recover: 0.80
    oi_drop_pct: 2.0
    # 레짐 엄격도: strict|loose|off (완화 비율에 영향)
    strictness: strict
  indicators:
    ema_fast: 3
    ema_slow: 9
    adx_len: 7
    keltner_len: 20
    keltner_mult: 1.40             # 1.25 → 1.40 (노이즈 완화)
    rsi2_low: 5                     # 4 → 5
    rsi2_high: 95                   # 96 → 95
    # 상위TF 바이어스(코드가 지원하면 적용): 5m EMA 50/200
    htf_bias:
      timeframe: "5m"
      ema_fast: 50
      ema_slow: 200
      bias_only: true               # 바이어스 반대 진입 금지

  orderbook:
    obi_window_ms: 1500            # OBI 계산 윈도우(ms)
    obi_threshold_mis: 0.60        # MIS용 OBI 임계
    min_depth_usd: 50000           # L1 명목 유동성(USDT) 최소

  # OB-Flow signal thresholds (A/B/C/D)
  obflow:
    # L5 불균형 기준 (절대값이 클수록 한쪽 벽이 강함)
    depth_imb_L5_min: 0.3
    # 스프레드가 mid 대비 이 값 이하일 때 ‘타이트’로 간주
    spread_tight_mult_mid: 0.0006
    # 돌파 패턴용 TPS(틱/초) 임계
    tps_min_breakout: 8.0
    # 흡수 후 반전 강도 임계
    c_absorption_min: 0.5
    # 스윕 후 평균회귀: 와이드 스프레드 임계(= mid*멀티)
    d_wide_spread_mult_mid: 0.0025
    # 마이크로 괴리/스프레드 비율 임계
    d_micro_dev_mult_spread: 0.65

  # 라우팅(메이커/테이커) 동적 전환 기준
  execution:
    # 강시그널이면 maker→taker 승격 허용 여부
    dynamic_taker_on_strong: true
    # 승격 기준들(2개 이상 충족 시 적용)
    tps_min: 8.0          # 틱/초 최소
    imb_l5_min: 0.25      # L5 불균형 최소
    spread_max: 0.0006    # 스프레드 상한(%)
    breakout_sigma: 0.0   # 표준편차 배수 임계(미사용시 0)

  entry_exit:
    # 순손익 기준 목표치(수수료 보정/틱 라운딩 적용)
    tp1: 0.0012                     # +0.12%
    trail_after_tp1: 0.0008         # +0.08%에서 트레일링 무장
    # 타임스탑을 전략별로 단축(분포를 좁혀 빠른 손절·정리)
    time_stop_mis: "15-25"          # "30-40" → "15-25"
    time_stop_vrs: "10-20"          # "20-30" → "10-20"
    time_stop_lsr: "8-15"           # "15-25" → "8-15"

  funding_time:
    avoid_taker_within_min: 5

# Runtime toggles (runner)
runtime:
  # 전략 선택: pack=MIS/VRS/LSR, obflow=OB-Flow
  strategy: pack
  # 디스커버리/회전
  discover_symbols: true           # 디스커버리 사용 여부
  consensus_ticks: 3               # 진입 전 관찰 틱 수
  no_trade_sleep_sec: 5.0          # 미진입 시 대기
  loop_idle_sec: 1.0               # 회전 간 간격
  exit_key: "q"                    # 종료 키
  refresh_universe_each_loop: true # 매 루프 유니버스 갱신
  # 동작 토글
  avoid_duplicate_symbol: true     # 보유/오픈오더 종목 스킵
  allow_flip: false                # 보유 중 반대 신호 즉시 플립 허용
  invert_signals: false            # 신호 반전(BUY↔SELL)
  attach_tpsl_on_create: false     # 주문 생성 시 TP/SL 부착
