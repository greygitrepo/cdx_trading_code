exchange:
  name: bybit
  network: mainnet
  category: linear

risk:
  max_leverage: 7
  max_alloc_pct: 1.0
  min_free_balance_usdt: 1

params:
  apex:
    scanner:
      min_15m_turnover_usd: 80000000
      max_spread_pct: 0.02
      min_depth_usd_l10: 400000
    strategy_A:
      tp1_pct: 0.18
      tp2_pct: 0.30
      sl_pct: 0.35
      time_stop_sec: 120
    strategy_B:
      entry_slip_guard_pct: 0.06
      tp1_pct: 0.35
      tp2_pct: 0.55
      sl_pct: 0.35
      time_stop_sec: 75
  orderbook:
    min_depth_usd: 20000
  entry_exit:
    tp1: 0.0010
    sl: 0.0015
    trail_after_tp1: 0.0008
  funding_time:
    avoid_taker_within_min: 5
  execution:
    dynamic_taker_on_strong: true
    tps_min: 8.0
    imb_l5_min: 0.25
    spread_max: 0.0006

runtime:
  strategy: apex
  discover_symbols: false
  consensus_ticks: 3
  no_trade_sleep_sec: 3.0
  loop_idle_sec: 1.0
  exit_key: "q"
  refresh_universe_each_loop: true
